onths, it's impossible to save."}, {"n": 514, "ko": "전 좀 처럼 화를 내지 않아요", "en": "It takes a lot to make me angry."}, {"n": 515, "ko": "다이어트를 꾸준히 하려면 많은 절제가 필요하다", "en": "It takes a lot of discipline to stick to a diet."}, {"n": 516, "ko": "(스쿠버 다이빙을 할 때) 물속에서 편안함을 느끼려면 많은 경험이 있어야 한다", "en": "It takes a lot of experience to feel comportable underwater."}, {"n": 517, "ko": "정거리 연애를 지속하려면 많은 믿음이 필요하다", "en": "It takes a lot of trust to maintain a long-distance relationship."}, {"n": 518, "ko": "첫인상을 망치는 건 정말 순식간이다", "en": "It doesn't take much to make a bad first impression."}, {"n": 519, "ko": "내 책을 마무리하기 위해서 정말 많은 노력을 했다", "en": "It took a lot of blood, sweat and tears to finish my book."}, {"n": 520, "ko": "사업체를 운영하려면 많은 노력이 필요하지", "en": "It takes a great deal of effort to run a business."}, {"n": 521, "ko": "맞는 말이야, 사업가로 살면 하루도 쉴 수가 없으니까", "en": "That's true, you never get a day off as an entrepreneur."}, {"n": 522, "ko": "빈센트가 맡은 이후로 팀이 훨씬 잘하고 있어요", "en": "The team's been doing so much better since vincent took over."}, {"n": 523, "ko": "맞아요! 이제 모두가 더욱 의욕이 있어 보여요", "en": "Seriously! everyone seems more motivated now."}, {"n": 524, "ko": "그는 훌륭한 리더가 될 자징ㄹ이 확실히 있는 것 같아요", "en": "I really think he has what it takes to be a great leader."}, {"n": 525, "ko": "동감입니다. 그는 사람들을 화합시키는 방법을 알고 있어요", "en": "Agreed. he knows how to bring people together."}, {"n": 526, "ko": "그 사람 지금 극심한 고통을 겪고 있습니다", "en": "He is in a great deal of pain."}, {"n": 527, "ko": "그 사람 지금 많이 아파요", "en": "He is in a lot of pain."}, {"n": 528, "ko": "저희 어머니는 정말 지혜로운 분이셨어요", "en": "My mother had a great deal of wisdom."}, {"n": 529, "ko": "제 사촌이 칠레에서 오래 생활을 해서 스페인어를 할 줄 알아요", "en": "My cousin spent a great deal of time in chile, so she speaks spanish."}, {"n": 530, "ko": "우리 아직 개발자 한 명 더 채용해야 하는데, 아는 사람 있어?", "en": "We still need to hire another developer. do you know anyone?"}, {"n": 531, "ko": "응, 있어. 내 사촌이 개발자인데 지식과 경험이 풍부해", "en": "Yeah, actually. my cousin is a developer with a great deal of knowledg const $=id=>document.getElementById(id);
const speechOK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function status(s){$('status').textContent=s}
function cancelAudio(){if(speechOK)window.speechSynthesis.cancel()}
function clearRun(){token++;if(timer!==null){clearTimeout(timer);timer=null}cancelAudio()}
function pause(){running=false;clearRun();$('play').textContent='▶ 자동 학습 시작';status('일시정지됨 · 카드 터치로 수동 학습 가능')}
function draw(){const c=cards[pos];$('count').textContent=(pos+1)+' / '+cards.length+' · 원본 '+c.n+'번';$('kind').textContent=answer?'영어 정답':'한국어 문장';$('sentence').textContent=answer?c.en:c.ko;$('hint').textContent=answer?'한 번 더 터치하면 다음 한글 →':'터치하면 영어 정답 →';$('num').value=c.n;try{localStorage.setItem('cards_last_number',String(c.n))}catch(e){}}
function chooseVoice(){const vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang==='en-US'&&/Samantha|Alex|Ava|Google US English/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.toLowerCase().startsWith('en'))||null}
function speak(text,done){if(!$('voice').checked||!speechOK){if(!speechOK&&$('voice').checked)status('이 브라우저는 음성 재생을 지원하지 않습니다.');if(done)done();return}cancelAudio();let count=0;const total=Number($('repeat').value);const myToken=token;function once(){if(myToken!==token)return;if(count>=total){if(done)done();return}count++;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('rate').value);const v=chooseVoice();if(v)u.voice=v;let finished=false;function finish(){if(finished)return;finished=true;if(myToken!==token)return;once()}u.onend=finish;u.onerror=finish;window.speechSynthesis.speak(u)}once()}
function nextCard(){pos=(pos+1)%cards.length;answer=false;draw()}
function showAnswer(){answer=true;draw();speak(cards[pos].en,null)}

function jump(){let n=Number($('num').value),p=cards.findIndex(x=>x.n===n);if(p<0){alert('해당 번호의 문장이 없습니다. (581번은 단어 목록입니다.)');return}if(running)pause();else clearRun();pos=p;answer=false;draw()}
function schedule(ms,fn){const current=token;timer=setTimeout(()=>{timer=null;if(current===token&&running)fn()},ms)}
function runCycle(){if(!running)return;answer=false;draw();status('한글을 보고 영어로 말해 보세요…');schedule(Number($('wait').value)*1000,()=>{answer=true;draw();status('영어 정답 듣는 중…');speak(cards[pos].en,()=>{if(!running)return;status('다음 문장 준비 중…');schedule(Number($('after').value)*1000,()=>{nextCard();runCycle()})})})}
function start(){if(running){pause();return}clearRun();running=true;answer=false;draw();$('auto').checked=true;$('play').textContent='⏸ 일시정지';if(!speechOK&&$('voice').checked)status('음성 지원이 없어 화면만 자동 진행합니다.');runCycle()}
$('card').addEventListener('click',flip);$('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('go').addEventListener('click',jump);$('num').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jump();$('num').blur()}});
$('play').addEventListener('click',start);$('listen').addEventListener('click',()=>{if(running)pause();else clearRun();answer=true;draw();speak(cards[pos].en,null)});
$('auto').addEventListener('change',()=>{if($('auto').checked)start();else if(running)pause()});
$('voice').addEventListener('change',()=>{if(!$('voice').checked)cancelAudio()});

try{let saved=Number(localStorage.getItem('cards_last_number'));let i=cards.findIndex(x=>x.n===saved);if(i>=0)pos=i}catch(e){}
